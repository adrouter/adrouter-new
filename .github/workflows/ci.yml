name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.17.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check out the immutable coding-runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: adrouter/adrouterCLI
          ref: be7c53dc0b63fb90b70bd6cb7cad4d5713cc0d1a
          path: .coding-source
          persist-credentials: false
      - name: Build and verify the locked coding fixture
        run: node scripts/build-coding-runtime.mjs .coding-source --verify
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
      # Source checks are not real KVM or installed-artifact acceptance.
